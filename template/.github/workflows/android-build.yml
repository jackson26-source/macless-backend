name: Build and upload to Google Play

# Android equivalent of ios-testflight.yml — builds a signed Android App
# Bundle (.aab) from the same Capacitor project and uploads it to Google
# Play. Runs on a standard Ubuntu runner (not macOS), which is both
# faster and well within GitHub's free minutes even on a private repo,
# since Android builds don't need the 10x macOS-runner multiplier iOS
# builds do. Entirely optional — skip this file if you're only shipping
# to the App Store. See ANDROID.md for the one-time setup.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build and sign only — don't upload to Google Play. Use this to produce the .aab for the very first manual upload, which Play requires before its API will accept releases for a new app."
        type: boolean
        default: false

# Least-privilege default: this workflow only builds/signs/uploads — it never
# needs to write back to the repo, so GITHUB_TOKEN doesn't need write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Capacitor 7's Android Gradle template targets Java 21 source/
      # target compatibility — JDK 17 here fails compileReleaseJavaWithJavac
      # with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ---- Fails fast, before spending any of the ~30-minute build on a
      # keystore that won't work. Same signing-doctor.sh the iOS workflow
      # now runs (and the same tool generate_signing_secrets.sh already
      # offers to run locally) — Android's checks only need keytool/
      # openssl, which work on any OS including a non-Mac customer's own
      # machine, so this isn't closing a "can't run this at all" gap the
      # way the iOS version does. It's just moving the same check earlier
      # in CI, so a bad keystore/password/alias fails in seconds instead
      # of after a full Gradle build.
      - name: Run Signing Doctor
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See ANDROID.md for the one-time keystore setup."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing-doctor-check.keystore"

          curl -fsSL "https://raw.githubusercontent.com/jackson26-source/macless-signing-doctor/main/signing-doctor.sh" -o "$RUNNER_TEMP/signing-doctor.sh"
          chmod +x "$RUNNER_TEMP/signing-doctor.sh"
          "$RUNNER_TEMP/signing-doctor.sh" \
            --android-keystore "$RUNNER_TEMP/signing-doctor-check.keystore" \
            --android-keystore-password "$ANDROID_KEYSTORE_PASSWORD" \
            --android-key-alias "$ANDROID_KEY_ALIAS" \
            --android-key-password "$ANDROID_KEY_PASSWORD"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JS dependencies
        run: npm install

      - name: Add + sync the Android platform (generates android/ from Capacitor's template)
        run: |
          # `npx cap add android` fails with "Could not find the android
          # platform" unless @capacitor/android is already an installed
          # dependency — Capacitor 5+ ships each platform as a separate
          # npm package rather than bundling it into @capacitor/cli. Most
          # projects only have @capacitor/ios if they set up iOS first
          # (per SIGNING.md), so install this before adding the platform.
          # Must match the project's existing @capacitor/core major
          # version exactly (they're peer-dependency locked) — installing
          # @latest here breaks the build the moment your project isn't
          # also on the newest Capacitor major version.
          CORE_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          CORE_MAJOR=$(echo "$CORE_VERSION" | cut -d. -f1)
          npm install "@capacitor/android@^${CORE_MAJOR}.0.0"
          npx cap add android
          npx cap sync android

      # ---- Google Play REJECTS an upload whose targetSdk is below the level
      # it currently mandates: "Your app currently targets API level 35 and
      # must target at least API level 36". Capacitor's generated
      # variables.gradle pins whatever API level was current when that
      # Capacitor version shipped, so a project generated today can already
      # be a full level behind on the day it first uploads. Verified against
      # a real Play Console upload, 2026-09-02.
      #
      # This patches the GENERATED project, not the customer's repo, because
      # `npx cap add android` recreates android/ from scratch on every run —
      # anything edited into it by hand is silently discarded next build.
      #
      # Google raises this floor roughly every August. Set an
      # ANDROID_TARGET_SDK repo variable to move ahead of the default here
      # without waiting on a template update.
      - name: Target the API level Google Play requires
        env:
          TARGET_SDK: ${{ vars.ANDROID_TARGET_SDK || '36' }}
        run: |
          cd android

          sed -i -E "s/(compileSdkVersion|targetSdkVersion)([[:space:]]*=[[:space:]]*)[0-9]+/\\1\\2${TARGET_SDK}/" variables.gradle

          echo "----- variables.gradle after patch -----"
          grep -E "(compile|target)SdkVersion" variables.gradle

          # sed exits 0 whether or not it matched anything, so a Capacitor
          # release that renames these keys would sail straight through to a
          # Play rejection 20 minutes later. Assert instead.
          for KEY in compileSdkVersion targetSdkVersion; do
            if ! grep -qE "${KEY}[[:space:]]*=[[:space:]]*${TARGET_SDK}([^0-9]|$)" variables.gradle; then
              echo "::error::Could not set ${KEY} to ${TARGET_SDK} in android/variables.gradle. Capacitor may have changed the layout of that file."
              exit 1
            fi
          done

          # AGP warns loudly when compileSdk is newer than the level it was
          # built against, and Capacitor's pinned AGP is always slightly
          # behind the level Play demands. Acknowledge it explicitly rather
          # than leaving a scary warning in every customer's build log.
          echo "android.suppressUnsupportedCompileSdk=${TARGET_SDK}" >> gradle.properties

      # ---- Play rejects any upload whose versionCode it has seen before:
      # "Version code 1 has already been used." Capacitor hardcodes
      # versionCode 1 into the generated app/build.gradle, so without this
      # the pipeline can upload exactly once and every run after it fails at
      # the very last step, after a full build. Tying it to the run number
      # makes it unique and monotonically increasing for free.
      #
      # Migrating an app that already has releases on Play? Set
      # ANDROID_VERSION_CODE_OFFSET to a number above your highest existing
      # versionCode, since this repo's run numbers start from 1.
      - name: Give the build a unique versionCode
        env:
          OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '0' }}
        run: |
          cd android
          VERSION_CODE=$(( ${{ github.run_number }} + OFFSET ))
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle

          if ! grep -qE "versionCode[[:space:]]+${VERSION_CODE}([^0-9]|$)" app/build.gradle; then
            echo "::error::Could not set versionCode in android/app/build.gradle."
            exit 1
          fi
          echo "::notice::Building versionCode ${VERSION_CODE}."

      # ---- sdkmanager is NOT on PATH on GitHub's Ubuntu runners — it lives
      # under $ANDROID_SDK_ROOT/cmdline-tools/<version>/bin. The line that
      # used to be here, `yes | sdkmanager --licenses > /dev/null || true`,
      # was therefore a silent no-op on every run that has ever executed:
      # bare `sdkmanager` exits 127 (command not found) and the `|| true`
      # swallowed it, so the step reported success while doing nothing.
      # Verified directly, 2026-09-02.
      #
      # The runner image also ships only a few SDK platforms, and not
      # necessarily the one Play requires the week Google raises the floor,
      # so the platform is installed explicitly. Both are no-ops when
      # already satisfied.
      - name: Accept licenses and install the SDK platform Play requires
        env:
          TARGET_SDK: ${{ vars.ANDROID_TARGET_SDK || '36' }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found under ${SDK_ROOT:-<no ANDROID_SDK_ROOT>}. Skipping the explicit install — the Android Gradle plugin will try to fetch API ${TARGET_SDK} itself. If the build fails with 'Failed to install the following SDK components', this is why."
            exit 0
          fi

          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # build-tools for a brand-new API level sometimes lands weeks after
          # the platform does, so a combined install can fail on a package
          # that simply doesn't exist yet. Fall back to the platform alone,
          # which is the part Gradle actually needs to compile against.
          "$SDKMANAGER" "platforms;android-${TARGET_SDK}" "build-tools;${TARGET_SDK}.0.0" || "$SDKMANAGER" "platforms;android-${TARGET_SDK}"


      - name: Build unsigned release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      # ---- Signing happens AFTER the build, directly on the .aab file
      # with jarsigner — the same idea as the iOS workflow signing via
      # xcodebuild flags rather than editing the Xcode project. Nothing
      # about signing ever gets written into the Capacitor-generated
      # android/ project itself, since `npx cap add android` regenerates
      # that project from scratch on every run.
      - name: Sign the AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See ANDROID.md for the one-time keystore setup."
            exit 1
          fi

          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEY_PASSWORD and ANDROID_KEYSTORE_PASSWORD must be identical."
            echo "keytool creates PKCS12 keystores by default, and PKCS12 does not support a key password separate from the store password. keytool prints a warning and SILENTLY IGNORES the key password you typed, so the key's real password is the store password. Signing then fails here with 'key associated with <alias> not a private key'. Set both secrets to the same value and re-run. See ANDROID.md."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

          AAB_PATH=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::No .aab found under android/app/build/outputs/bundle/release — the bundleRelease step must have failed silently."
            exit 1
          fi

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"

          echo "----- verifying signature -----"
          # jarsigner -verify exits 0 even when the file is completely UNSIGNED, so
          # calling it bare proves nothing. -strict is worse than useless here: it
          # exits 0 on an unsigned jar and NON-ZERO on a correctly signed one, because
          # a self-signed upload key trips its trust check. Grepping the output is the
          # only reliable gate. Both behaviours verified directly, 2026-08-31.
          if ! jarsigner -verify "$AAB_PATH" | grep -q "^jar verified"; then
            echo "::error::The AAB came out unsigned — jarsigner found no signature. Not uploading."
            jarsigner -verify "$AAB_PATH" || true
            exit 1
          fi
          echo "jar verified."

          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"

      # Always published as an artifact, upload or not — this is the file you
      # hand-upload to Play Console for a new app's first release, and it's
      # also what you inspect when an upload is rejected.
      - name: Publish the signed AAB as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play
        id: play_upload
        if: ${{ inputs.skip_upload != true }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ vars.ANDROID_PLAY_TRACK || 'internal' }}
          status: completed

      # ---- A failed upload is almost always one of three setup gaps, not a
      # broken build, and the raw error Google returns names none of them:
      # you get "Package not found", a bare 403, or occasionally an HTML
      # login page. The signed .aab is already saved as an artifact by this
      # point, so nothing is lost either way.
      - name: Explain why the Play upload failed
        if: ${{ always() && steps.play_upload.outcome == 'failure' }}
        run: |
          echo "::error::The build and the signing both worked — the .aab is attached to this run as the artifact named signed-aab. Only the upload to Google Play failed."
          echo ""
          echo "Three things cause this, in rough order of likelihood:"
          echo ""
          echo "1. THIS APP HAS NEVER HAD A MANUAL UPLOAD."
          echo "   Google Play refuses API releases for an app until a human has"
          echo "   uploaded one build through Play Console. This is a one-time"
          echo "   thing and it is almost certainly what happened here."
          echo "   Fix: download the signed-aab artifact from this run, then in"
          echo "   Play Console go to Testing > Internal testing > Create new"
          echo "   release and upload it by hand. Every release after that one"
          echo "   can come from this workflow."
          echo ""
          echo "2. The service account cannot see this app."
          echo "   In Play Console under Users and permissions, the service"
          echo "   account email needs Release to testing tracks (or Release"
          echo "   manager) granted on THIS app specifically, not just at the"
          echo "   account level."
          echo ""
          echo "3. ANDROID_PACKAGE_NAME does not match the listing."
          echo "   It has to equal the appId in capacitor.config.json and the"
          echo "   package name of the Play listing, exactly. Play package names"
          echo "   can never be changed or reused, so a typo here means creating"
          echo "   a new listing."
          echo ""
          echo "ANDROID.md in this repo has the full setup."
          exit 1

      - name: Note when upload was skipped
        if: ${{ inputs.skip_upload == true }}
        run: |
          echo "::notice::Upload skipped. Download the 'signed-aab' artifact from this run and upload it by hand in Play Console under Testing > Internal testing > Create new release. Google Play will not accept API releases for an app that has never had a build uploaded through the Console."
