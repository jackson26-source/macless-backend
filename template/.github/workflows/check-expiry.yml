name: Certificate/keystore expiry check

# Catches an expiring iOS certificate/provisioning profile or Android
# signing key BEFORE it silently breaks a real build — Apple certs and
# profiles typically expire after ~1 year, and while Android keys are
# usually generated with a much longer validity, it costs nothing to
# check both on the same schedule.
#
# Runs weekly and pings the same NOTIFY_WEBHOOK_URL webhook used by the
# build workflows, but ONLY when something needs attention (expiring
# soon, or already expired) — not on every clean run, so this doesn't
# turn into weekly noise you start ignoring. A full report is always
# written to this run's Summary tab either way (Actions tab -> this
# workflow -> a run -> Summary), so you can check anytime even when it
# stayed quiet.
#
# Uses this product's own vendored scripts/signing-doctor.sh — the exact
# same free, standalone tool at github.com/jackson26-source/macless-signing-doctor,
# kept as a local copy here so this workflow doesn't depend on an
# external repo staying reachable/unchanged to do its job.
#
# Does nothing (and doesn't fail) for whichever secrets you haven't set —
# if you only bought the $39 Android-only SKU, the iOS half is silently
# skipped, and vice versa.

on:
  schedule:
    # Every Monday at 13:00 UTC. Change the cron expression if you'd
    # rather it run on a different day/time — https://crontab.guru helps.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

# Least-privilege default: this workflow only reads secrets and posts to a
# webhook, it never needs to write back to the repo.
permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode iOS profile/certificate (if configured)
        id: decode_ios
        env:
          IOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISION_PROFILE_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          if [ -z "$IOS_APP_PROVISION_PROFILE_BASE64" ]; then
            echo "IOS_APP_PROVISION_PROFILE_BASE64 not set — skipping iOS checks."
            echo "has_ios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$IOS_APP_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ]; then
            echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          fi
          echo "has_ios=true" >> "$GITHUB_OUTPUT"

      - name: Decode Android keystore (if configured)
        id: decode_android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set — skipping Android checks."
            echo "has_android=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "has_android=true" >> "$GITHUB_OUTPUT"

      - name: Run signing-doctor
        id: doctor
        if: steps.decode_ios.outputs.has_ios == 'true' || steps.decode_android.outputs.has_android == 'true'
        env:
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x scripts/signing-doctor.sh
          ARGS=()
          if [ "${{ steps.decode_ios.outputs.has_ios }}" = "true" ]; then
            ARGS+=(--profile "$RUNNER_TEMP/app.mobileprovision")
            [ -n "$APPLE_TEAM_ID" ] && ARGS+=(--expected-team-id "$APPLE_TEAM_ID")
            [ -n "$IOS_BUNDLE_ID" ] && ARGS+=(--expected-bundle-id "$IOS_BUNDLE_ID")
            if [ -f "$RUNNER_TEMP/dist.p12" ]; then
              ARGS+=(--cert "$RUNNER_TEMP/dist.p12" --cert-password "$IOS_DIST_CERT_PASSWORD")
            fi
          fi
          if [ "${{ steps.decode_android.outputs.has_android }}" = "true" ]; then
            ARGS+=(--android-keystore "$RUNNER_TEMP/release.keystore" --android-keystore-password "$ANDROID_KEYSTORE_PASSWORD")
            if [ -n "$ANDROID_KEY_ALIAS" ]; then
              ARGS+=(--android-key-alias "$ANDROID_KEY_ALIAS")
            fi
            if [ -n "$ANDROID_KEY_PASSWORD" ]; then
              ARGS+=(--android-key-password "$ANDROID_KEY_PASSWORD")
            fi
          fi

          set +e
          OUTPUT="$(./scripts/signing-doctor.sh "${ARGS[@]}" 2>&1)"
          STATUS=$?
          set -e

          echo "$OUTPUT"

          # Notify-worthy if signing-doctor failed outright, or passed with
          # a warning (e.g. "expires in 25 days") — either way something
          # needs a human to look, even though only FAIL affects the exit
          # code.
          if [ "$STATUS" -ne 0 ] || echo "$OUTPUT" | grep -q "PASSED WITH WARNINGS"; then
            echo "needs_attention=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_attention=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify webhook (only if something needs attention)
        if: always() && steps.doctor.outputs.needs_attention == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "NOTIFY_WEBHOOK_URL secret not set — nothing to notify, but see the"
            echo "Summary tab on this run for what signing-doctor found."
            exit 0
          fi
          MSG="⚠️ Macless: this week's certificate/keystore expiry check for ${{ github.repository }} found something worth a look — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (Summary tab)."
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"$MSG\"}" \
            "$WEBHOOK_URL" || echo "Webhook POST failed (non-fatal)."
