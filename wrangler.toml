name = "macless-backend"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Routes this Worker on the paths it owns; the rest of macless.dev stays
# on whatever's already serving it (GitHub Pages, per the download-worker
# setup). Requires the macless.dev zone to already be on Cloudflare,
# which it is.
routes = [
  # Trailing * on these four: an exact-match route (no *) was empirically
  # observed to miss any request carrying a query string (e.g. ?session_id=...)
  # and fall through to the old GitHub Pages origin instead of this Worker,
  # even though a bare request with no query string matched fine. All four
  # of these need a query string (session_id, code, state) to function, so
  # they all get the wildcard. Found + fixed 2026-08-26 during live testing.
  { pattern = "macless.dev/get-started*", zone_name = "macless.dev" },
  { pattern = "macless.dev/login*", zone_name = "macless.dev" },
  { pattern = "macless.dev/oauth/callback*", zone_name = "macless.dev" },
  { pattern = "macless.dev/app", zone_name = "macless.dev" },
  { pattern = "macless.dev/app/*", zone_name = "macless.dev" },
  { pattern = "macless.dev/api/*", zone_name = "macless.dev" }
]

[[d1_databases]]
binding = "DB"
database_name = "macless-backend"
database_id = "592684c3-db4b-4df0-9bee-40983c775788"  # macless-backend D1 database — created + schema applied live via the Cloudflare dashboard, 2026-08-25

# Macless Autopilot's heartbeat sweep (see the scheduled() handler in
# src/index.js) — re-checks every active subscription against Stripe and
# logs a bot_events row either way. Twice a day is plenty for a heartbeat;
# tighten this once Phase 2's real timed actions (cert-expiry renewal)
# land and need finer granularity than "twice a day" to be useful.
[triggers]
crons = ["0 */12 * * *"]

# Vars (not secret — fine to see in `wrangler.toml`):
[vars]
PUBLIC_BASE_URL = "https://macless.dev"
GA4_MEASUREMENT_ID = "G-L4YTJNNDS1" # same property/stream macless-site's gtag snippet reports to -- not sensitive, just an id

# Secrets (STRIPE_RESTRICTED_KEY, STRIPE_PRICE_ID_IOS, STRIPE_PRICE_ID_ANDROID,
# STRIPE_PRICE_ID_AUTOPILOT, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# TOKEN_ENCRYPTION_KEY, SESSION_SECRET, GA4_API_SECRET) are NOT set here — see DEPLOY.md.
# GA4_API_SECRET: a GA4 Measurement Protocol API secret (Admin > Data Streams >
# macless.dev > Measurement Protocol API secrets), used only to send the
# server-verified "purchase" event in src/index.js's sendGA4Purchase(). The
# /get-started route no-ops that call safely if this isn't set yet.
# They go in via `wrangler secret put NAME` or the Cloudflare dashboard, so
# they never sit in a file that could get committed anywhere.
# (STRIPE_PRICE_ID_* and GITHUB_CLIENT_ID aren't actually sensitive, but
# keeping all eight in one place — secrets — is simpler than splitting
# them and there's no cost to it. STRIPE_PRICE_ID_AUTOPILOT is optional —
# /api/autopilot/checkout 501s cleanly until it's set, so this deploys
# safely before Jackson has created the recurring Price in Stripe.)
